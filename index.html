<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#08080a" />
<title>MUSICon</title>
<link rel="icon" type="image/png" href="favicon.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #08080a;
    --surface: #121217;
    --surface-2: #1b1b22;
    --stroke: rgba(255,255,255,.07);
    --text: #f5f5f7;
    --muted: #8e8e99;
    --accent-1: #c0262d;
    --accent-2: #80181d;
    --accent-glow: rgba(192, 38, 45, .42);
  }

  html { -webkit-text-size-adjust: 100%; }

  body {
    min-height: 100dvh;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
    padding-top: env(safe-area-inset-top);
  }
  body.locked { overflow: hidden; }

  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    pointer-events: none;
    z-index: 0;
    opacity: .35;
  }
  body::before {
    width: 320px; height: 320px;
    background: radial-gradient(circle, var(--accent-1), transparent 70%);
    top: -100px; right: -80px;
  }
  body::after {
    width: 280px; height: 280px;
    background: radial-gradient(circle, #5b1317, transparent 70%);
    top: 400px; left: -100px;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 0 16px calc(24px + env(safe-area-inset-bottom));
  }

  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 4px 22px;
  }
  .logo-wrap { display: flex; align-items: center; gap: 10px; }
  .logo-badge {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 4px 14px rgba(192,38,45,.4);
    background: #121217;
  }
  .logo-badge img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .logo {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -.03em;
    color: #ffffff;
  }
  .logo span {
    color: #ef4444;
  }
  .version {
    font-size: 11px;
    font-weight: 600;
    color: #fca5a5;
    background: rgba(192,38,45,.2);
    border: 1px solid rgba(192,38,45,.35);
    padding: 2px 7px;
    border-radius: 20px;
    letter-spacing: .02em;
  }

  .latest-card {
    position: relative;
    background: linear-gradient(165deg, rgba(27,27,34,.92) 0%, rgba(18,18,23,.96) 100%);
    border: 1px solid var(--stroke);
    border-radius: 22px;
    padding: 18px;
    box-shadow:
      0 20px 40px -15px rgba(0,0,0,.7),
      0 0 0 1px rgba(255,255,255,.04);
    overflow: hidden;
  }
  .latest-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 85% 15%, var(--accent-glow), transparent 60%);
    pointer-events: none;
    opacity: .4;
  }
  .latest-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    position: relative;
    z-index: 1;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: #fda4af;
    background: rgba(192,38,45,.22);
    border: 1px solid rgba(192,38,45,.4);
    padding: 4px 10px;
    border-radius: 20px;
  }
  .pill::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #ff4d58;
    box-shadow: 0 0 8px #ff4d58;
    animation: pulseDot 2s infinite;
  }
  @keyframes pulseDot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: .4; transform: scale(.8); }
  }
  .latest-date {
    font-size: 11.5px;
    color: var(--muted);
    font-weight: 500;
  }
  .latest-body {
    display: flex;
    gap: 14px;
    align-items: center;
    position: relative;
    z-index: 1;
  }
  .latest-info {
    flex: 1;
    min-width: 0;
  }
  .latest-title {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -.02em;
    line-height: 1.25;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .latest-artist {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .latest-meta {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    font-size: 11px;
    font-weight: 600;
    color: #d4d4d8;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.07);
    padding: 3px 8px;
    border-radius: 6px;
  }
  .latest-score-box {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: center;
    flex-shrink: 0;
    padding-left: 10px;
  }
  .latest-score-box .score {
    font-size: 38px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -.04em;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(135deg, #ffffff 40%, #fca5a5 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 10px rgba(192,38,45,.4));
  }
  .latest-score-box .score-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    margin-top: 4px;
  }

  .artist-link {
    display: inline-block;
    cursor: pointer;
    color: inherit;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-color: rgba(255,255,255,.2);
    transition: color .15s ease, text-decoration-color .15s ease;
  }
  .artist-link:hover, .artist-link:active {
    color: #ff6b72;
    text-decoration-color: #ff6b72;
  }
  .artist-sep {
    color: var(--muted);
  }

  .cover {
    position: relative;
    flex-shrink: 0;
    border-radius: 12px;
    overflow: hidden;
    background: var(--surface-2);
    border: 1px solid rgba(255,255,255,.08);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 20px -6px rgba(0,0,0,.6);
  }
  .cover.large { width: 76px; height: 76px; border-radius: 14px; }
  .cover.small { width: 44px; height: 44px; border-radius: 10px; }
  .cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .cover-initial {
    font-weight: 800;
    color: rgba(255,255,255,.7);
    user-select: none;
  }
  .cover.large .cover-initial { font-size: 26px; }
  .cover.small .cover-initial { font-size: 16px; }

  .block {
    margin-top: 24px;
  }
  .block-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    padding: 0 4px;
  }
  .block-title {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -.01em;
    color: #e4e4e7;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .block-count {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--stroke);
    padding: 2px 7px;
    border-radius: 12px;
  }

  .accordion-btn {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--stroke);
    border-radius: 16px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease;
  }
  .accordion-btn:hover { background: #17171e; }
  .accordion-btn:active { transform: scale(.995); }
  .accordion-btn .chevron {
    width: 18px;
    height: 18px;
    transition: transform .25s ease;
    opacity: .6;
  }
  .accordion-btn[aria-expanded="true"] .chevron {
    transform: rotate(180deg);
  }
  .accordion-content {
    display: none;
    margin-top: 10px;
  }
  .accordion-content.open { display: block; }

  .release-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .release-item {
    background: var(--surface);
    border: 1px solid var(--stroke);
    border-radius: 14px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: background .15s ease;
  }
  .release-item:hover { background: #17171e; }
  .item-info {
    flex: 1;
    min-width: 0;
  }
  .item-title {
    font-size: 13.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item-artist {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item-score {
    flex: 0 0 auto;
    font-size: 15px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.02em;
    background: linear-gradient(135deg, #ffffff, #fca5a5);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .artists-card {
    background: var(--surface);
    border: 1px solid var(--stroke);
    border-radius: 18px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .artist-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 12px;
    cursor: pointer;
    transition: background .15s ease, transform .15s ease;
    user-select: none;
  }
  .artist-row:hover { background: #1a1a22; }
  .artist-row:active { transform: scale(.99); }

  .artist-row .rank {
    width: 22px;
    font-size: 13px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    text-align: center;
  }
  .artist-row.rank-1 .rank { color: #FFD700; text-shadow: 0 0 10px rgba(255,215,0,.45); }
  .artist-row.rank-2 .rank { color: #C0C0C0; text-shadow: 0 0 8px rgba(192,192,192,.35); }
  .artist-row.rank-3 .rank { color: #CD7F32; text-shadow: 0 0 8px rgba(205,127,50,.35); }
  .artist-row.rank-4 .rank, .artist-row.rank-5 .rank { color: #565662; }

  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.1);
    position: relative;
  }
  .avatar img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .artist-row.rank-1 .avatar {
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.2),
      0 0 0 2px rgba(255,215,0,.7),
      0 0 16px rgba(255,215,0,.35);
  }
  .artist-row.rank-2 .avatar {
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.16),
      0 0 0 2px rgba(192,192,192,.7),
      0 0 14px rgba(192,192,192,.25);
  }
  .artist-row.rank-3 .avatar {
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.14),
      0 0 0 2px rgba(205,127,50,.65),
      0 0 14px rgba(205,127,50,.25);
  }

  .artist-info { flex: 1; min-width: 0; }
  .artist-name {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .artist-sub {
    margin-top: 2px;
    font-size: 11.5px;
    color: var(--muted);
  }
  .artist-score {
    flex: 0 0 auto;
    font-size: 15px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.02em;
    background: linear-gradient(135deg, #ffffff, #fca5a5);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .artist-view {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 100;
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
    transition: transform .32s cubic-bezier(.16, 1, .3, 1);
    overflow: hidden;
  }
  .artist-view.open { transform: translateY(0); }
  .artist-view::before {
    content: "";
    position: absolute;
    width: 380px; height: 380px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--artist-glow, var(--accent-glow)), transparent 70%);
    top: -120px; left: 50%;
    transform: translateX(-50%);
    filter: blur(80px);
    opacity: .5;
    pointer-events: none;
  }
  .artist-view-header {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(14px + env(safe-area-inset-top)) 16px 14px;
    border-bottom: 1px solid var(--stroke);
    background: rgba(8,8,10,.8);
    backdrop-filter: blur(16px);
  }
  .back-btn {
    background: var(--surface);
    border: 1px solid var(--stroke);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .back-btn:active { transform: scale(.97); }
  .artist-view-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px calc(30px + env(safe-area-inset-bottom));
    position: relative;
    z-index: 1;
    max-width: 480px;
    width: 100%;
    margin: 0 auto;
  }
  .artist-hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--stroke);
  }
  .artist-hero .avatar {
    width: 96px;
    height: 96px;
    box-shadow:
      0 12px 30px -8px rgba(0,0,0,.8),
      inset 0 0 0 2px rgba(255,255,255,.15);
  }
  .artist-hero .avatar .cover-initial { font-size: 38px; }
  .artist-hero-name {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -.03em;
    margin-top: 14px;
  }
  .artist-hero-stats {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .stat-chip {
    font-size: 12px;
    font-weight: 600;
    color: #e4e4e7;
    background: var(--surface);
    border: 1px solid var(--stroke);
    padding: 5px 12px;
    border-radius: 20px;
  }
  .stat-chip strong {
    color: #fff;
    font-weight: 800;
  }

  .internal-top-title {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    margin: 20px 4px 10px;
  }
  .internal-top {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .internal-top-item {
    background: var(--surface);
    border: 1px solid var(--stroke);
    border-radius: 14px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .internal-top-item .rank {
    width: 20px;
    font-size: 13px;
    font-weight: 800;
    color: var(--muted);
    text-align: center;
  }
  .internal-top-item:nth-child(1) .rank { color: #FFD700; }
  .internal-top-item:nth-child(2) .rank { color: #C0C0C0; }
  .internal-top-item:nth-child(3) .rank { color: #CD7F32; }

  .status {
    padding: 36px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }
  .error-block {
    background: rgba(192,38,45,.12);
    border: 1px solid rgba(192,38,45,.3);
    color: #fca5a5;
    padding: 14px 16px;
    border-radius: 14px;
    font-size: 12.5px;
    line-height: 1.4;
    text-align: center;
    margin: 12px 0;
  }

  .debug-panel {
    display: none;
    margin-top: 16px;
    background: #000;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 10px;
    font-family: monospace;
    font-size: 10.5px;
    color: #999;
    max-height: 180px;
    overflow-y: auto;
    white-space: pre-wrap;
  }
  .debug-panel.visible { display: block; }
  .debug-panel .ok { color: #4ade80; }
  .debug-panel .fail { color: #f87171; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

<body>
<div class="app">

  <header class="app-header">
    <div class="logo-wrap">
      <div class="logo-badge">
        <img src="logo.png" alt="MUSICon" />
      </div>
      <div class="logo">MUSIC<span>on</span></div>
      <div class="version">v0.4</div>
    </div>
  </header>

  <div id="latestContainer">
    <div class="status">Загрузка свежей оценки…</div>
  </div>

  <section class="block">
    <button class="accordion-btn" id="accBtn" aria-expanded="false">
      <span class="label">Все оценки <span class="count" id="allCount">…</span></span>
      <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>
    <div class="accordion-content" id="accContent">
      <ul class="release-list" id="releaseList"></ul>
    </div>
  </section>

  <section class="block">
    <div class="block-header">
      <h2 class="block-title">
        Топ артистов
        <span class="block-count">ТОП-5</span>
      </h2>
    </div>
    <div class="artists-card" id="artistsCard">
      <div class="status">Загрузка артистов…</div>
    </div>
  </section>

</div>

<div class="artist-view" id="artistView" aria-hidden="true">
  <div class="artist-view-header">
    <button class="back-btn" id="backBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Назад
    </button>
    <div style="font-size:12px;font-weight:600;color:var(--muted)">Дискография</div>
    <div style="width:60px"></div>
  </div>
  <div class="artist-view-scroll" id="artistViewContent"></div>
</div>

<div class="debug-panel" id="debugPanel"></div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbx-eCuxFNWP3mQbrQZuxwKCvU9YFoS2YMdkNPedDm8W2GbdVN3WR-gsiczSlRW0ZmXh/exec";

  const COVER_CACHE_KEY = "musicon_covers_v8";
  const NEGATIVE_TTL_MS = 60 * 60 * 1000;

  const DEBUG = new URLSearchParams(location.search).has("debug");
  const DISCOGS_TOKEN = "ВАШ_ТОКЕН_DISCOGS";

  const debugLines = [];
  function dbg(line, isOk) {
    if (!DEBUG) return;
    debugLines.push(isOk === true ? `<span class="ok">✓ ${line}</span>`
                  : isOk === false ? `<span class="fail">✗ ${line}</span>`
                  : line);
    const panel = document.getElementById("debugPanel");
    if (panel) {
      panel.classList.add("visible");
      panel.innerHTML = debugLines.join("\n");
    }
    console.log("[MUSICon]", line);
  }

  if (window.Telegram?.WebApp) {
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    try {
      tg.setHeaderColor("#08080a");
      tg.setBackgroundColor("#08080a");
    } catch (e) {}
  }
  const haptic = (style = "light") => {
    try { window.Telegram?.WebApp?.HapticFeedback?.impactOccurred(style); } catch (e) {}
  };

  const $  = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

  function splitArtists(str) {
    if (!str) return [];
    return String(str)
      .split(";")
      .map(s => s.trim())
      .filter(Boolean);
  }

  function renderArtistLinks(artistStr) {
    const list = splitArtists(artistStr);
    if (!list.length) return escapeHtml(artistStr || "");
    return list.map(name =>
      `<span class="artist-link" data-artist="${escapeHtml(name)}">${escapeHtml(name)}</span>`
    ).join('<span class="artist-sep">; </span>');
  }

  function stringHash(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) {
      h = ((h << 5) - h) + str.charCodeAt(i);
      h |= 0;
    }
    return Math.abs(h);
  }
  function artistGradient(name) {
    const hash = stringHash(name || "?");
    const hue1 = (hash % 40) + 345;
    const hue2 = (hue1 + 25) % 360;
    return `linear-gradient(135deg, hsl(${hue1}, 72%, 46%), hsl(${hue2}, 78%, 32%))`;
  }
  function artistGlow(name) {
    const hash = stringHash(name || "?");
    const hue = (hash % 35) + 345;
    return `hsla(${hue}, 75%, 48%, .45)`;
  }
  function escapeHtml(str) {
    return String(str ?? "").replace(/[&<>"']/g, ch => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[ch]));
  }
  function plural(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
    return many;
  }
  const initial = (name) => (name || "?").trim().charAt(0).toUpperCase();

  function clean(s) {
    return String(s || "")
      .toLowerCase()
      .replace(/\([^)]*\)/g, " ")
      .replace(/\[[^\]]*\]/g, " ")
      .replace(/[\.,\/#!$%\^&\*;:{}=\-_`~()]/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }
  function wordOverlap(a, b) {
    const wa = new Set(clean(a).split(" ").filter(w => w.length > 1));
    const wb = new Set(clean(b).split(" ").filter(w => w.length > 1));
    if (!wa.size || !wb.size) return 0;
    let common = 0;
    for (const w of wa) if (wb.has(w)) common++;
    return common / Math.min(wa.size, wb.size);
  }
  function artistMatches(targetArtist, candidateArtist) {
    const targetClean = clean(targetArtist);
    const candClean   = clean(candidateArtist);
    if (!targetClean || !candClean) return false;
    if (targetClean === candClean) return true;
    if (targetClean.includes(candClean) || candClean.includes(targetClean)) return true;
    if (wordOverlap(targetClean, candClean) >= 0.5) return true;
    return false;
  }

  let coverCache = {};
  try {
    coverCache = JSON.parse(localStorage.getItem(COVER_CACHE_KEY) || "{}");
  } catch (e) { coverCache = {}; }

  function saveCache() {
    try {
      localStorage.setItem(COVER_CACHE_KEY, JSON.stringify(coverCache));
    } catch (e) {}
  }
  function makeKey(artist, album) {
    return `${clean(artist)}:::${clean(album)}`;
  }
  function getCached(artist, album) {
    const key = makeKey(artist, album);
    const rec = coverCache[key];
    if (!rec) return undefined;
    if (typeof rec === "string") return rec;
    if (rec.url) return rec.url;
    if (rec.failedAt && (Date.now() - rec.failedAt < NEGATIVE_TTL_MS)) {
      return null;
    }
    return undefined;
  }
  function setCached(artist, album, url) {
    const key = makeKey(artist, album);
    if (url) {
      coverCache[key] = { url, ts: Date.now() };
    } else {
      coverCache[key] = { failedAt: Date.now() };
    }
    saveCache();
  }

  async function searchDiscogs(artist, album) {
    if (!DISCOGS_TOKEN || DISCOGS_TOKEN === "ВАШ_ТОКЕН_DISCOGS") return null;

    const query = `${artist} - ${album}`.trim();
    const url = `https://api.discogs.com/database/search?q=${encodeURIComponent(query)}&type=release&per_page=3&token=${DISCOGS_TOKEN}`;

    try {
      const res = await fetch(url, {
        headers: { "User-Agent": "MUSIConApp/0.4 (+https://t.me)" }
      });
      if (!res.ok) {
        dbg(`Discogs HTTP ${res.status} для "${query}"`, false);
        return null;
      }
      const data = await res.json();
      const results = data.results || [];
      if (!results.length) return null;

      for (const item of results) {
        const itemTitle = item.title || "";
        const parts = itemTitle.split(" - ");
        const candArtist = parts[0] || "";
        const candAlbum  = parts.slice(1).join(" - ") || itemTitle;

        const aOk = artistMatches(artist, candArtist);
        const tOk = wordOverlap(album, candAlbum) >= 0.4 || clean(candAlbum).includes(clean(album));

        if (aOk && tOk && item.cover_image && !item.cover_image.endsWith("spacer.gif")) {
          dbg(`Discogs: найдено для "${query}" -> "${itemTitle}"`, true);
          return item.cover_image;
        }
      }
      return null;
    } catch (e) {
      dbg(`Discogs ошибка "${query}": ${e.message}`, false);
      return null;
    }
  }

  async function searchItunes(term, expectedArtist, expectedTitle) {
    const url = `https://itunes.apple.com/search?term=${encodeURIComponent(term)}&entity=album&limit=5`;
    try {
      const res = await fetch(url);
      if (!res.ok) return null;
      const data = await res.json();
      const results = data.results || [];
      if (!results.length) return null;

      for (const item of results) {
        if (!artistMatches(expectedArtist, item.artistName)) continue;
        const albumClean = clean(expectedTitle);
        const candClean  = clean(item.collectionName);
        if (candClean.includes(albumClean) || albumClean.includes(candClean) || wordOverlap(albumClean, candClean) >= 0.4) {
          const raw = item.artworkUrl100 || item.artworkUrl60;
          if (raw) return raw.replace(/100x100bb|60x60bb/, "600x600bb");
        }
      }
      return null;
    } catch (e) {
      return null;
    }
  }

  async function fetchCover(artist, album) {
    const cached = getCached(artist, album);
    if (cached !== undefined) return cached;

    let cover = await searchDiscogs(artist, album);

    if (!cover) {
      cover = await searchItunes(`${artist} ${album}`, artist, album);
    }
    if (!cover) {
      cover = await searchItunes(album, artist, album);
    }

    setCached(artist, album, cover);
    return cover;
  }

  function coverHTML({ artist, album, explicitUrl, sizeClass = "small" }) {
    const init = escapeHtml(initial(artist));
    const bg   = artistGradient(artist);
    const key  = makeKey(artist, album);

    if (explicitUrl) {
      return `
        <div class="cover ${sizeClass}" style="background:${bg}">
          <span class="cover-initial">${init}</span>
          <img src="${escapeHtml(explicitUrl)}" alt="" loading="lazy"
               onload="this.previousElementSibling.style.display='none'"
               onerror="this.remove()">
        </div>
      `;
    }

    const cached = getCached(artist, album);
    if (cached) {
      return `
        <div class="cover ${sizeClass}" style="background:${bg}">
          <span class="cover-initial">${init}</span>
          <img src="${escapeHtml(cached)}" alt="" loading="lazy"
               onload="this.previousElementSibling.style.display='none'"
               onerror="this.remove()">
        </div>
      `;
    }

    return `
      <div class="cover ${sizeClass} cover-placeholder" style="background:${bg}"
           data-artist="${escapeHtml(artist)}"
           data-album="${escapeHtml(album)}"
           data-key="${escapeHtml(key)}">
        <span class="cover-initial">${init}</span>
      </div>
    `;
  }

  async function hydrateCovers(container) {
    const placeholders = $$(".cover-placeholder", container);
    if (!placeholders.length) return;

    for (const ph of placeholders) {
      const art = ph.getAttribute("data-artist");
      const alb = ph.getAttribute("data-album");
      if (!art || !alb) continue;

      fetchCover(art, alb).then(url => {
        if (!url || !ph.isConnected) return;
        const img = document.createElement("img");
        img.loading = "lazy";
        img.alt = "";
        img.onload = () => {
          const initSpan = ph.querySelector(".cover-initial");
          if (initSpan) initSpan.style.display = "none";
          ph.classList.remove("cover-placeholder");
        };
        img.onerror = () => img.remove();
        img.src = url;
        ph.appendChild(img);
      });
    }
  }

  let allReleases = [];
  let globalArtistImages = {};
  const artistMap = new Map();
  let currentArtist = null;

  function buildArtistMap() {
    artistMap.clear();
    for (const r of allReleases) {
      const artists = splitArtists(r.artist);
      if (!artists.length && r.artist) artists.push(r.artist);

      for (const name of artists) {
        if (!artistMap.has(name)) {
          const img = globalArtistImages[name] || globalArtistImages[name.trim()] || "";
          artistMap.set(name, { name, releases: [], imageUrl: img });
        }
        const entry = artistMap.get(name);
        if (!entry.releases.includes(r)) {
          entry.releases.push(r);
        }
      }
    }
    for (const entry of artistMap.values()) {
      entry.releases.sort((a, b) => b.avg1000 - a.avg1000);
    }
  }

  function calculateArtistStats(entry) {
    const releases = entry.releases;
    let totalPoints = 0;
    let totalTracks = 0;

    for (const r of releases) {
      const tracks = Math.max(1, Number(r.track_count) || (
        /сингл|single/i.test(r.type) ? 1 :
        /ep|мини/i.test(r.type) ? 4 :
        /альбом|album|lp/i.test(r.type) ? 10 : 1
      ));
      totalPoints += (r.avg1000 * tracks);
      totalTracks += tracks;
    }

    const rawAvg = totalTracks > 0 ? (totalPoints / totalTracks) : 0;
    const GLOBAL_AVERAGE = 700;
    const MIN_TRACKS = 10;
    const weightedAvg = (totalPoints + (GLOBAL_AVERAGE * MIN_TRACKS)) / (totalTracks + MIN_TRACKS);
    const bestScore = releases.length ? Math.max(...releases.map(r => r.avg1000)) : 0;

    return {
      count: releases.length,
      totalTracks,
      rawAvg,
      weightedAvg,
      bestScore
    };
  }

  function renderLatest(r) {
    const c = $("#latestContainer");
    if (!r) {
      c.innerHTML = `<div class="status">Релизы не найдены</div>`;
      return;
    }

    const trackLabel = r.track_count ? ` · ${r.track_count} ${plural(r.track_count, "трек", "трека", "треков")}` : "";

    c.innerHTML = `
      <div class="latest-card">
        <div class="latest-top">
          <span class="pill">Свежая оценка</span>
          <span class="latest-date">${escapeHtml(r.date || "Недавно")}</span>
        </div>
        <div class="latest-body">
          ${coverHTML({
            artist: r.artist,
            album: r.release,
            explicitUrl: r.cover_url,
            sizeClass: "large"
          })}
          <div class="latest-info">
            <div class="latest-title" title="${escapeHtml(r.release)}">${escapeHtml(r.release)}</div>
            <div class="latest-artist">
              ${renderArtistLinks(r.artist)}
            </div>
            <div class="latest-meta">${escapeHtml(r.type || "Релиз")}${trackLabel}</div>
          </div>
          <div class="latest-score-box">
            <div class="score">${Math.round(r.avg1000)}</div>
            <div class="score-label">Балл</div>
          </div>
        </div>
      </div>
    `;
    hydrateCovers(c);
  }

  function renderReleases() {
    const list = $("#releaseList");
    const count = $("#allCount");
    count.textContent = `(${allReleases.length})`;

    list.innerHTML = allReleases.map(r => {
      const trackLabel = r.track_count ? ` · ${r.track_count} ${plural(r.track_count, "трек", "трека", "треков")}` : "";
      return `
      <li class="release-item">
        ${coverHTML({
          artist: r.artist,
          album: r.release,
          explicitUrl: r.cover_url,
          sizeClass: "small"
        })}
        <div class="item-info">
          <div class="item-title">${escapeHtml(r.release)}</div>
          <div class="item-artist">
            ${renderArtistLinks(r.artist)}
            · ${escapeHtml(r.type || "")}${trackLabel}
          </div>
        </div>
        <div class="item-score">${Math.round(r.avg1000)}</div>
      </li>
    `}).join("");
    hydrateCovers(list);
  }

  function renderArtists() {
    const card = $("#artistsCard");
    if (!artistMap.size) {
      card.innerHTML = `<div class="status">Нет данных для топа</div>`;
      return;
    }

    const artists = [...artistMap.values()]
      .map(a => {
        const stats = calculateArtistStats(a);
        return {
          name: a.name,
          avg: stats.weightedAvg,
          rawAvg: stats.rawAvg,
          count: stats.count,
          totalTracks: stats.totalTracks,
          imageUrl: a.imageUrl
        };
      })
      .sort((a, b) => b.avg - a.avg)
      .slice(0, 5);

    card.innerHTML = artists.map((a, i) => {
      const bg   = artistGradient(a.name);
      const init = escapeHtml(initial(a.name));
      const rankNum = i + 1;
      const imgHTML = a.imageUrl
        ? `<img src="${escapeHtml(a.imageUrl)}" alt="" onerror="this.remove()">`
        : "";
      return `
        <div class="artist-row rank-${rankNum}" data-artist="${escapeHtml(a.name)}">
          <span class="rank">${rankNum}</span>
          <div class="avatar" style="background:${bg}">
            <span class="cover-initial">${init}</span>
            ${imgHTML}
          </div>
          <div class="artist-info">
            <div class="artist-name">${escapeHtml(a.name)}</div>
            <div class="artist-sub">${a.count} ${plural(a.count, "релиз", "релиза", "релизов")} · ${a.totalTracks} ${plural(a.totalTracks, "трек", "трека", "треков")}</div>
          </div>
          <div class="artist-score">${Math.round(a.avg)}</div>
        </div>
      `;
    }).join("");
  }

  function openArtist(name) {
    const entry = artistMap.get(name);
    if (!entry) return;
    currentArtist = name;
    haptic("light");

    const view    = $("#artistView");
    const content = $("#artistViewContent");
    const releases  = entry.releases;
    const stats     = calculateArtistStats(entry);

    view.style.setProperty("--artist-glow", artistGlow(name));

    const bg   = artistGradient(name);
    const init = escapeHtml(initial(name));

    const avatarImg = entry.imageUrl
      ? `<img src="${escapeHtml(entry.imageUrl)}" alt="" onerror="this.remove()">`
      : "";

    const internalTop = releases.map((r, i) => {
      const trackLabel = r.track_count ? ` · ${r.track_count} ${plural(r.track_count, "трек", "трека", "треков")}` : "";
      return `
      <div class="internal-top-item">
        <span class="rank">${i + 1}</span>
        ${coverHTML({
          artist: r.artist,
          album: r.release,
          explicitUrl: r.cover_url,
          sizeClass: "small"
        })}
        <div class="item-info">
          <div class="item-title">${escapeHtml(r.release)}</div>
          <div class="item-artist">${escapeHtml(r.type || "")}${trackLabel}${r.date ? " · " + escapeHtml(r.date) : ""}</div>
        </div>
        <div class="item-score">${Math.round(r.avg1000)}</div>
      </div>
    `}).join("");

    content.innerHTML = `
      <div class="artist-hero">
        <div class="avatar" style="background:${bg}">
          <span class="cover-initial">${init}</span>
          ${avatarImg}
        </div>
        <h1 class="artist-hero-name">${escapeHtml(name)}</h1>
        <div class="artist-hero-stats">
          <span class="stat-chip"><strong>${stats.count}</strong> ${plural(stats.count, "релиз", "релиза", "релизов")}</span>
          <span class="stat-chip"><strong>${stats.totalTracks}</strong> ${plural(stats.totalTracks, "трек", "трека", "треков")}</span>
          <span class="stat-chip">Взвешенный балл: <strong>${Math.round(stats.weightedAvg)}</strong></span>
          <span class="stat-chip">Лучший релиз: <strong>${Math.round(stats.bestScore)}</strong></span>
        </div>
      </div>

      <div class="internal-top-title">Все релизы артиста (по баллам)</div>
      <div class="internal-top">
        ${internalTop}
      </div>
    `;

    hydrateCovers(content);
    view.classList.add("open");
    view.setAttribute("aria-hidden", "false");
    document.body.classList.add("locked");

    if (window.Telegram?.WebApp?.BackButton) {
      window.Telegram.WebApp.BackButton.show();
      window.Telegram.WebApp.BackButton.onClick(closeArtist);
    }
  }

  function closeArtist() {
    const view = $("#artistView");
    view.classList.remove("open");
    view.setAttribute("aria-hidden", "true");
    document.body.classList.remove("locked");
    currentArtist = null;
    haptic("light");

    if (window.Telegram?.WebApp?.BackButton) {
      window.Telegram.WebApp.BackButton.hide();
      window.Telegram.WebApp.BackButton.offClick(closeArtist);
    }
  }

  document.addEventListener("click", e => {
    const link = e.target.closest(".artist-link");
    if (link) {
      e.stopPropagation();
      const artist = link.getAttribute("data-artist");
      if (artist) openArtist(artist);
      return;
    }

    const row = e.target.closest(".artist-row");
    if (row) {
      const artist = row.getAttribute("data-artist");
      if (artist) openArtist(artist);
      return;
    }
  });

  $("#backBtn").addEventListener("click", closeArtist);

  const accBtn = $("#accBtn");
  const accContent = $("#accContent");
  accBtn.addEventListener("click", () => {
    const open = accContent.classList.toggle("open");
    accBtn.setAttribute("aria-expanded", String(open));
    haptic("selection_change");
  });

  async function loadData() {
    try {
      const res = await fetch(API_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      if (Array.isArray(data)) {
        allReleases = data;
        globalArtistImages = {};
      } else {
        allReleases = data.releases || [];
        globalArtistImages = data.artists || {};
      }

      buildArtistMap();

      if (allReleases.length) {
        renderLatest(allReleases[0]);
      } else {
        renderLatest(null);
      }

      renderReleases();
      renderArtists();
    } catch (err) {
      console.error(err);
      $("#latestContainer").innerHTML = `
        <div class="error-block">
          Не удалось загрузить данные из таблицы.<br>
          <small style="opacity:.8">${escapeHtml(err.message)}</small>
        </div>
      `;
      $("#artistsCard").innerHTML = `<div class="status">Ошибка загрузки данных</div>`;
    }
  }

  loadData();
</script>
</body>
</html>
