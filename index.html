<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#08080a" />
<title>MUSICon</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #08080a;
    --surface: #121217;
    --surface-2: #1b1b22;
    --stroke: rgba(255,255,255,.07);
    --text: #f5f5f7;
    --muted: #8e8e99;
    --accent-1: #c0262d;
    --accent-2: #80181d;
    --accent-glow: rgba(192, 38, 45, .42);
  }

  html { -webkit-text-size-adjust: 100%; }

  body {
    min-height: 100dvh;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
    padding-top: env(safe-area-inset-top);
  }
  body.locked { overflow: hidden; }

  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(95px);
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    width: 440px; height: 440px;
    top: -190px; left: -90px;
    background: rgba(192, 38, 45, .26);
  }
  body::after {
    width: 380px; height: 380px;
    top: -130px; right: -130px;
    background: rgba(128, 24, 29, .20);
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 8px 16px calc(40px + env(safe-area-inset-bottom));
  }

  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 4px 22px;
  }
  .logo-wrap { display: flex; align-items: center; gap: 10px; }
  .logo-badge {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .logo-svg {
    width: 32px;
    height: 32px;
    display: block;
    border-radius: 6px;
    box-shadow: 0 4px 14px rgba(192,38,45,.4);
  }
  .logo {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -.03em;
    line-height: 1;
    color: #f5f5f7;
  }
  .logo span {
    background: linear-gradient(135deg, #ef4444, #b91c1c);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .version {
    font-size: 10px;
    font-weight: 600;
    color: #5c5c69;
    letter-spacing: .04em;
    padding: 3px 7px;
    background: rgba(255,255,255,.05);
    border-radius: 100px;
  }

  /* ---------- ОБЛОЖКИ ---------- */
  .cover-wrap {
    position: relative;
    overflow: hidden;
    display: block;
    background-color: #1a1a22;
    flex: 0 0 auto;
  }
  .cover-wrap.big {
    width: 88px;
    height: 88px;
    border-radius: 18px;
    box-shadow: 0 14px 28px -12px rgba(0,0,0,.85);
  }
  .cover-wrap.small {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    box-shadow: 0 4px 12px -6px rgba(0,0,0,.9);
  }
  .cover-wrap .cover-initial {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-weight: 800;
    color: rgba(255,255,255,.92);
    text-shadow: 0 2px 12px rgba(0,0,0,.35);
    letter-spacing: -.03em;
    z-index: 1;
  }
  .cover-wrap.big .cover-initial { font-size: 34px; }
  .cover-wrap.small .cover-initial { font-size: 17px; }

  .cover-wrap img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 2;
    display: block;
  }

  /* ---------- КАРТОЧКА РЕЛИЗА ---------- */
  .release-card {
    position: relative;
    overflow: hidden;
    padding: 16px;
    border-radius: 26px;
    background: linear-gradient(160deg, #181820 0%, #0d0d12 65%);
    border: 1px solid var(--stroke);
    box-shadow: 0 22px 45px -22px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .release-card::after {
    content: "";
    position: absolute;
    top: -90px; right: -70px;
    width: 210px; height: 210px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(192,38,45,.35), transparent 70%);
    pointer-events: none;
  }
  .release-top {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    z-index: 1;
  }
  .release-meta { min-width: 0; }
  .pill {
    display: inline-block;
    margin-bottom: 8px;
    padding: 5px 10px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: #fca5a5;
    background: rgba(192,38,45,.15);
    border: 1px solid rgba(192,38,45,.3);
    border-radius: 100px;
  }
  .release-title {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -.025em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .release-artist {
    margin-top: 3px;
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .artist-link {
    cursor: pointer;
    color: var(--muted);
    transition: color .15s ease, text-decoration .15s ease;
  }
  .artist-link:hover, .artist-link:active {
    color: #ffffff;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .artist-sep {
    color: #5c5c69;
    user-select: none;
  }
  .release-system {
    margin-top: 4px;
    font-size: 11px;
    color: #6b6b78;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .rating-row {
    position: relative;
    z-index: 1;
    margin-top: 18px;
    display: flex;
    align-items: flex-end;
    gap: 14px;
  }
  .score {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -.045em;
    line-height: .95;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(135deg, #ffffff, #fca5a5);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    white-space: nowrap;
  }
  .bar {
    flex: 1;
    height: 8px;
    margin-bottom: 7px;
    border-radius: 100px;
    background: rgba(255,255,255,.08);
    overflow: hidden;
  }
  .bar i {
    display: block;
    height: 100%;
    width: 0;
    border-radius: inherit;
    background: linear-gradient(90deg, #c0262d, #ef4444);
    box-shadow: 0 0 16px rgba(220,38,38,.6);
    transition: width 1.1s cubic-bezier(.22,1,.36,1);
  }

  .block { margin-top: 22px; }
  .block-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 4px 12px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -.02em;
  }
  .block-title .hint {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
  }

  .accordion-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 18px;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--stroke);
    border-radius: 18px;
    cursor: pointer;
    box-shadow: 0 14px 30px -20px rgba(0,0,0,.95);
    transition: background .2s ease;
  }
  .accordion-btn:active { background: var(--surface-2); }
  .accordion-btn .label { display: flex; align-items: center; }
  .count {
    margin-left: 9px;
    padding: 3px 9px;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    background: rgba(255,255,255,.07);
    border-radius: 100px;
  }
  .chevron {
    flex: 0 0 auto;
    color: var(--muted);
    transition: transform .38s cubic-bezier(.4,0,.2,1);
  }
  .accordion-btn.open .chevron { transform: rotate(180deg); }
  .accordion-panel {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows .38s cubic-bezier(.4,0,.2,1);
  }
  .accordion-panel.open { grid-template-rows: 1fr; }
  .accordion-inner { overflow: hidden; min-height: 0; }

  .release-list {
    list-style: none;
    margin-top: 10px;
    background: var(--surface);
    border: 1px solid var(--stroke);
    border-radius: 18px;
    overflow: hidden;
  }
  .release-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid rgba(255,255,255,.05);
  }
  .release-item:last-child { border-bottom: none; }
  .item-info { flex: 1; min-width: 0; }
  .item-title {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item-artist {
    margin-top: 2px;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item-score {
    flex: 0 0 auto;
    font-size: 14px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #fca5a5;
  }

  .artists-card {
    padding: 6px;
    background: var(--surface);
    border: 1px solid var(--stroke);
    border-radius: 22px;
    box-shadow: 0 24px 45px -26px rgba(0,0,0,.95);
  }
  .artist-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 10px;
    border-radius: 16px;
    cursor: pointer;
  }
  .artist-row:active { background: rgba(255,255,255,.045); }
  .rank {
    flex: 0 0 auto;
    width: 18px;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #565662;
  }
  .artist-row.top .rank { color: #f59e0b; }
  .avatar {
    flex: 0 0 auto;
    width: 42px; height: 42px;
    border-radius: 50%;
    overflow: hidden;
    position: relative;
    display: grid;
    place-items: center;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.14);
    font-size: 16px;
    font-weight: 800;
    color: #fff;
  }
  .avatar .cover-initial { font-size: 16px; }
  .avatar img {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 2;
  }
  .artist-row.top .avatar {
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.14),
      0 0 0 2px rgba(245,158,11,.55),
      0 0 18px rgba(245,158,11,.3);
  }
  .artist-info { flex: 1; min-width: 0; }
  .artist-name {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .artist-sub {
    margin-top: 2px;
    font-size: 11.5px;
    color: var(--muted);
  }
  .artist-score {
    flex: 0 0 auto;
    font-size: 15px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.02em;
    background: linear-gradient(135deg, #ffffff, #fca5a5);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .status {
    padding: 24px 8px;
    text-align: center;
    font-size: 14px;
    color: var(--muted);
  }
  .status.error { color: #fca5a5; }

  .artist-view {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--bg);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: calc(env(safe-area-inset-top) + 12px) 0 calc(env(safe-area-inset-bottom) + 32px);
    transform: translateX(100%);
    transition: transform .38s cubic-bezier(.32,.72,0,1);
    will-change: transform;
  }
  .artist-view.open { transform: translateX(0); }
  .artist-view::before {
    content: "";
    position: absolute;
    top: -160px; left: 50%;
    transform: translateX(-50%);
    width: 520px; height: 380px;
    border-radius: 50%;
    background: var(--artist-glow, rgba(192,38,45,.4));
    filter: blur(100px);
    opacity: .55;
    pointer-events: none;
  }
  .artist-view-inner {
    position: relative;
    max-width: 480px;
    margin: 0 auto;
    padding: 0 16px;
  }
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px 8px 10px;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    background: rgba(255,255,255,.06);
    border: 1px solid var(--stroke);
    border-radius: 100px;
    cursor: pointer;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .back-btn svg { display: block; }

  .artist-hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 26px 12px 22px;
    animation: rise .5s cubic-bezier(.22,1,.36,1) both;
  }
  .artist-hero .avatar {
    width: 108px; height: 108px;
    font-size: 42px;
    box-shadow:
      0 18px 42px -18px rgba(0,0,0,.9),
      inset 0 0 0 1px rgba(255,255,255,.16);
  }
  .artist-hero .avatar .cover-initial { font-size: 42px; }
  .artist-hero-name {
    margin-top: 16px;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -.035em;
    line-height: 1.1;
  }
  .artist-hero-stats {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .stat-chip {
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    background: rgba(255,255,255,.05);
    border: 1px solid var(--stroke);
    border-radius: 100px;
  }
  .stat-chip strong { color: var(--text); font-weight: 700; }

  .internal-top-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 10px;
    border-radius: 14px;
  }
  .internal-top-item .rank { width: 22px; font-size: 14px; color: var(--muted); }
  .internal-top-item:nth-child(1) .rank { color: #f59e0b; }
  .internal-top-item:nth-child(2) .rank { color: #d1d5db; }
  .internal-top-item:nth-child(3) .rank { color: #f97316; }

  .debug-panel {
    display: none;
    position: fixed;
    left: 8px; right: 8px; bottom: 8px;
    max-height: 45vh;
    overflow-y: auto;
    z-index: 999;
    padding: 12px 14px;
    font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #d1d5db;
    background: rgba(10,10,14,.94);
    border: 1px solid var(--stroke);
    border-radius: 14px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    white-space: pre-wrap;
  }
  .debug-panel.visible { display: block; }
  .debug-panel .ok   { color: #86efac; }
  .debug-panel .fail { color: #fda4af; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .app-header, .release-card, .block {
    animation: rise .6s cubic-bezier(.22,1,.36,1) both;
  }
  .release-card { animation-delay: .06s; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
<script src="/_aistudio-iframe.js?v=1f94f900"></script></head>

<body>
<div class="app">

  <header class="app-header">
    <div class="logo-wrap">
      <div class="logo-badge">
        <svg class="logo-svg" width="32" height="32" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">

    <button class="accordion-btn" id="accBtn" aria-expanded="false" aria-controls="accPanel">

      <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none"

      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
      Назад
    </button>
    <div id="artistViewContent"></div>
  </div>
</div>

<script>
  /* ============================================================
     НАСТРОЙКИ
     ============================================================ */
  const API_URL = "https://script.google.com/macros/s/AKfycbx-eCuxFNWP3mQbrQZuxwKCvU9YFoS2YMdkNPedDm8W2GbdVN3WR-gsiczSlRW0ZmXh/exec";

  const COVER_CACHE_KEY = "musicon_covers_v7";
  const NEGATIVE_TTL_MS = 60 * 60 * 1000;

  const DEBUG = new URLSearchParams(location.search).has("debug");

  const DISCOGS_TOKEN = "ВАШ_ТОКЕН_DISCOGS";

  const debugLines = [];
  function dbg(line, isOk) {
    if (!DEBUG) return;
    debugLines.push(isOk === true ? `<span class="ok">✓ ${line}</span>`
                  : isOk === false ? `<span class="fail">✗ ${line}</span>`
                  : line);
    const panel = document.getElementById("debugPanel");
    if (panel) {
      panel.classList.add("visible");
      panel.innerHTML = debugLines.join("\n");
    }
    console.log("[MUSICon]", line);
  }

  /* ============================================================
     TELEGRAM
     ============================================================ */
  if (window.Telegram?.WebApp) {
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    try {
      tg.setHeaderColor("#08080a");
      tg.setBackgroundColor("#08080a");
    } catch (e) {}
  }
  const haptic = (style = "light") => {
    try { window.Telegram?.WebApp?.HapticFeedback?.impactOccurred(style); } catch (e) {}
  };

  /* ============================================================
     УТИЛИТЫ И РАЗДЕЛЕНИЕ СОВМЕСТНЫХ АРТИСТОВ
     ============================================================ */
  const $  = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

  // Разбивает строку с артистами по точке с запятой ";"
  function splitArtists(str) {
    if (!str) return [];
    return String(str)
      .split(";")
      .map(s => s.trim())
      .filter(Boolean);
  }

  // Создает отдельные кликабельные элементы для каждого артиста
  function renderArtistLinks(artistStr) {
    const list = splitArtists(artistStr);
    if (!list.length) return escapeHtml(artistStr || "");
    return list.map(name =>
      `<span class="artist-link" data-artist="${escapeHtml(name)}">${escapeHtml(name)}</span>`
    ).join('<span class="artist-sep">; </span>');
  }

  function stringHash(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) {
      h = ((h << 5) - h) + str.charCodeAt(i);
      h |= 0;
    }
    return Math.abs(h);
  }
  function artistGradient(name) {
    const hash = stringHash(name || "?");
    const hue1 = (hash % 40) + 345; // красно-рубиновые и бордовые оттенки
    const hue2 = (hue1 + 25) % 360;
    return `linear-gradient(135deg, hsl(${hue1}, 72%, 46%), hsl(${hue2}, 78%, 32%))`;
  }
  function artistGlow(name) {
    const hash = stringHash(name || "?");
    const hue = (hash % 35) + 345;
    return `hsla(${hue}, 75%, 48%, .45)`;
  }
  function escapeHtml(str) {
    return String(str ?? "").replace(/[&<>"']/g, ch => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[ch]));
  }
  function plural(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
    return many;
  }
  const initial = (name) => (name || "?").trim().charAt(0).toUpperCase();

  /* ============================================================
     ПРОВЕРКА «ПОДЛИННОСТИ» — совпадает ли исполнитель
     ============================================================ */
  function normalizeName(s) {
    return String(s || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^\p{L}\p{N}]/gu, "")
      .trim();
  }

  function artistMatches(queryArtist, candidateArtist) {
    const q = normalizeName(queryArtist);
    const c = normalizeName(candidateArtist);
    if (!q || !c) return false;
    if (q === c) return true;
    if (c.includes(q) || q.includes(c)) return true;

    // Поддержка проверки соавторов при совместных релизах
    if (queryArtist && queryArtist.includes(";")) {
      const parts = splitArtists(queryArtist).map(normalizeName);
      if (parts.some(p => p && (c.includes(p) || p.includes(c)))) return true;
    }
    return false;
  }

  /* ============================================================
     КЭШ ОБЛОЖЕК
     ============================================================ */
  function loadCoverCache() {
    try { return JSON.parse(localStorage.getItem(COVER_CACHE_KEY)) || {}; }
    catch { return {}; }
  }
  function saveCoverCache(c) {
    try { localStorage.setItem(COVER_CACHE_KEY, JSON.stringify(c)); } catch {}
  }

  const coverCache = loadCoverCache();
  const coverRequests = new Map();

  function getCacheEntry(key) {
    const e = coverCache[key];
    if (!e) return { state: "miss" };
    if (typeof e === "string") return { state: "hit", url: e };
    if (e.url) return { state: "hit", url: e.url };
    if (e.none) {
      if (Date.now() - e.none < NEGATIVE_TTL_MS) return { state: "none" };
      delete coverCache[key];
      saveCoverCache(coverCache);
      return { state: "miss" };
    }
    return { state: "miss" };
  }
  function setCacheHit(key, url) {
    coverCache[key] = { url };
    saveCoverCache(coverCache);
  }
  function setCacheNone(key) {
    coverCache[key] = { none: Date.now() };
    saveCoverCache(coverCache);
  }

  /* ============================================================
     СЕТЕВЫЕ ХЕЛПЕРЫ
     ============================================================ */
  function fetchWithTimeout(url, options = {}, timeoutMs = 6000) {
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), timeoutMs);
    return fetch(url, { ...options, signal: controller.signal })
      .finally(() => clearTimeout(id));
  }

  function firstNonNull(promises) {
    return new Promise((resolve) => {
      let pending = promises.length;
      if (pending === 0) return resolve(null);
      promises.forEach(p => {
        Promise.resolve(p)
          .then(v => {
            if (v) resolve(v);
            else if (--pending === 0) resolve(null);
          })
          .catch(() => {
            if (--pending === 0) resolve(null);
          });
      });
    });
  }

  /* ============================================================
     ИСТОЧНИКИ ОБЛОЖЕК
     ============================================================ */
  async function fetchITunes(artist, album) {
    const artists = splitArtists(artist);
    const queries = [
      `${artist} ${album}`.trim(),
      `${album} ${artist}`.trim(),
      ...artists.map(a => `${a} ${album}`.trim()),
      album.trim()
    ].filter(Boolean);

    for (const q of queries) {
      for (const country of ["ru", "us"]) {
        const url = `https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=album&country=${country}&limit=10`;
        try {
          const res = await fetchWithTimeout(url, { cache: "no-store" }, 5000);
          if (!res.ok) continue;
          const data = await res.json();
          if (!data?.results?.length) continue;

          for (const r of data.results) {
            const candidateArtist = r.artistName || "";
            if (!artistMatches(artist, candidateArtist)) {
              dbg(`iTunes skip [${candidateArtist} ≠ ${artist}]: ${r.collectionName || "?"}`, false);
              continue;
            }
            const art = r.artworkUrl100 || r.artworkUrl60;
            if (art) {
              const big = art
                .replace(/100x100(bb)?/, "600x600$1")
                .replace(/60x60(bb)?/,  "600x600$1");
              dbg(`iTunes (${country}) OK: "${artist}" — "${r.collectionName}"`, true);
              return big;
            }
          }
        } catch (e) {}
      }
    }
    return null;
  }

  async function fetchDeezer(artist, album) {
    const cleanQuery = artist.includes(";") ? artist.split(";")[0].trim() : artist;
    const q = encodeURIComponent(`${cleanQuery} ${album}`.trim());
    const target = `https://api.deezer.com/search/album?q=${q}&limit=10`;
    const proxy = `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(target)}`;
    try {
      const res = await fetchWithTimeout(proxy, { cache: "no-store" }, 6000);
      if (!res.ok) return null;
      const data = await res.json();
      const albums = data?.data || [];
      for (const a of albums) {
        const candidateArtist = a.artist?.name || "";
        if (!artistMatches(artist, candidateArtist)) {
          dbg(`Deezer skip [${candidateArtist} ≠ ${artist}]: ${a.title || "?"}`, false);
          continue;
        }
        const cover = a.cover_xl || a.cover_big || a.cover_medium;
        if (cover) {
          dbg(`Deezer OK: "${artist}" — "${a.title}"`, true);
          return cover;
        }
      }
    } catch (e) {}
    return null;
  }

  let mbLastRequestTime = 0;
  async function mbApiFetch(url) {
    const wait = Math.max(0, 1100 - (Date.now() - mbLastRequestTime));
    if (wait > 0) await new Promise(r => setTimeout(r, wait));
    mbLastRequestTime = Date.now();
    return fetchWithTimeout(url, { headers: { "Accept": "application/json" } }, 6000);
  }
  async function caaFetch(url) {
    return fetchWithTimeout(url, { headers: { "Accept": "application/json" } }, 6000);
  }

  async function fetchMusicBrainz(artist, album) {
    try {
      const searchArtist = artist.includes(";") ? artist.split(";")[0].trim() : artist;
      const query = `artist:"${searchArtist}" AND release:"${album}"`;
      const url = `https://musicbrainz.org/ws/2/release-group/?query=${encodeURIComponent(query)}&fmt=json&limit=5`;
      const res = await mbApiFetch(url);
      if (!res.ok) return null;
      const data = await res.json();
      const groups = data?.["release-groups"] || [];
      if (!groups.length) return null;

      const tries = groups.map(async (g) => {
        const credits = g["artist-credit"] || [];
        const names = credits.map(c => c.name || c.artist?.name).filter(Boolean);
        if (!names.some(n => artistMatches(artist, n))) {
          dbg(`MusicBrainz skip [${names.join(", ")} ≠ ${artist}]: ${g.title}`, false);
          throw new Error("artist mismatch");
        }

        const caaRes = await caaFetch(`https://coverartarchive.org/release-group/${g.id}`);
        if (!caaRes.ok) throw new Error("no caa");
        const caaJson = await caaRes.json();
        const images = caaJson?.images || [];
        if (!images.length) throw new Error("no images");
        const front = images.find(i => i.front) || images[0];
        const thumbs = front.thumbnails || {};
        const imageUrl = thumbs["500"] || thumbs["large"] || thumbs["1200"] || front.image;
        if (!imageUrl) throw new Error("no url");
        return imageUrl;
      });

      try {
        const imageUrl = await Promise.any(tries);
        if (imageUrl) {
          dbg(`MusicBrainz OK: "${artist}" — "${album}"`, true);
          return imageUrl;
        }
      } catch {}
    } catch (e) {}
    return null;
  }

  async function fetchDiscogs(artist, album) {
    if (!DISCOGS_TOKEN) return null;
    const cleanArtist = artist.includes(";") ? artist.split(";")[0].trim() : artist;
    const q = encodeURIComponent(`${cleanArtist} ${album}`.trim());
    const url = `https://api.discogs.com/database/search?q=${q}&type=release&per_page=3`;
    try {
      const res = await fetchWithTimeout(url, {
        headers: {
          "Authorization": `Discogs token=${DISCOGS_TOKEN}`,
          "User-Agent": "MUSICon/0.351"
        }
      }, 7000);
      if (!res.ok) return null;
      const data = await res.json();
      const results = data?.results || [];
      for (const r of results) {
        const img = r.cover_image || r.thumb;
        if (img && !img.includes("spacer.gif")) {
          dbg(`Discogs OK: ${artist} - ${album}`, true);
          return img;
        }
      }
    } catch (e) {}
    return null;
  }

  /* ============================================================
     ГЛАВНАЯ ЛОГИКА ОБЛОЖЕК
     ============================================================ */
  async function resolveCover(artist, album, explicitUrl) {
    if (explicitUrl) return explicitUrl;

    const key = `${artist}|${album}`;

    const cached = getCacheEntry(key);
    if (cached.state === "hit") {
      dbg(`cache: ${key}`, true);
      return cached.url;
    }
    if (cached.state === "none") {
      dbg(`cache (no cover): ${key}`, false);
      return null;
    }
    if (coverRequests.has(key)) return coverRequests.get(key);

    const promise = (async () => {
      const url = await firstNonNull([
        fetchITunes(artist, album),
        fetchDeezer(artist, album),
        fetchMusicBrainz(artist, album)
      ]);
      if (url) {
        setCacheHit(key, url);
        dbg(`resolved (digital): ${key}`, true);
        return url;
      }

      dbg(`digital failed, trying Discogs: ${key}`, false);
      const discogsUrl = await fetchDiscogs(artist, album);
      if (discogsUrl) {
        setCacheHit(key, discogsUrl);
        dbg(`resolved (Discogs fallback): ${key}`, true);
        return discogsUrl;
      }

      setCacheNone(key);
      dbg(`no cover anywhere: ${key}`, false);
      return null;
    })();

    coverRequests.set(key, promise);
    return promise;
  }

  /* ============================================================
     HTML ОБЛОЖКИ
     ============================================================ */
  function coverHTML({ artist, album, explicitUrl, sizeClass }) {
    const bg   = artistGradient(artist);
    const init = escapeHtml(initial(album || artist || "?"));
    const cls  = sizeClass === "big" ? "big" : "small";
    return `
      <div class="cover-wrap ${cls}" style="background:${bg}">
        <span class="cover-initial">${init}</span>
        <img alt=""
             data-cover-artist="${escapeHtml(artist)}"
             data-cover-album="${escapeHtml(album)}"
             data-cover-url="${escapeHtml(explicitUrl || "")}">
      </div>
    `;
  }

  async function hydrateCovers(root = document) {
    const imgs = $$("img[data-cover-album]", root).filter(i => !i.dataset.hydrated);
    await Promise.all(imgs.map(async (img) => {
      img.dataset.hydrated = "1";
      try {
        const url = await resolveCover(
          img.dataset.coverArtist,
          img.dataset.coverAlbum,
          img.dataset.coverUrl
        );
        if (!url) return;

        img.addEventListener("error", () => {
          const k = `${img.dataset.coverArtist}|${img.dataset.coverAlbum}`;
          setCacheNone(k);
          dbg(`img failed to load: ${k}`, false);
          img.remove();
        }, { once: true });

        img.src = url;
      } catch {}
    }));
  }

  /* ============================================================
     ГЛОБАЛЬНОЕ СОСТОЯНИЕ И МАТЕМАТИЧЕСКИЙ РАСЧЕТ РЕЙТИНГА
     ============================================================ */
  let allReleases = [];
  const artistMap = new Map();
  let currentArtist = null;

  function buildArtistMap(releases) {
    artistMap.clear();
    for (const r of releases) {
      const list = splitArtists(r.artist);
      const artists = list.length ? list : [r.artist || "?"];
      const isSolo = artists.length === 1;

      for (const name of artists) {
        if (!artistMap.has(name)) {
          artistMap.set(name, { name, releases: [], imageUrl: "" });
        }
        const entry = artistMap.get(name);
        if (!entry.releases.includes(r)) {
          entry.releases.push(r);
        }
        // Если у релиза есть фото артиста:
        // отдаем приоритет сольным релизам артиста или заполняем, если еще не было фото
        if (r.artist_image_url) {
          if (!entry.imageUrl || isSolo) {
            entry.imageUrl = r.artist_image_url;
          }
        }
      }
    }
    for (const entry of artistMap.values()) {
      entry.releases.sort((a, b) => b.avg1000 - a.avg1000);
    }
  }

  // Честный расчет рейтинга артиста: Sum(score * tracks) / Sum(tracks)
  function calculateArtistStats(entry) {
    const releases = entry.releases;
    let totalPoints = 0;
    let totalTracks = 0;

    for (const r of releases) {
      const tracks = Math.max(1, Number(r.track_count) || (
        /сингл|single/i.test(r.type) ? 1 :
        /ep|мини/i.test(r.type) ? 4 :
        /альбом|album|lp/i.test(r.type) ? 10 : 1
      ));
      totalPoints += (r.avg1000 * tracks);
      totalTracks += tracks;
    }

    const avg = totalTracks > 0 ? (totalPoints / totalTracks) : 0;
    const bestScore = releases.length ? Math.max(...releases.map(r => r.avg1000)) : 0;

    return {
      avg,
      count: releases.length,
      totalTracks,
      bestScore
    };
  }

  /* ============================================================
     РЕНДЕР
     ============================================================ */
  function renderLatest(releases) {
    const container = $("#latestContainer");
    if (!releases.length) {
      container.innerHTML = `<div class="status">Пока нет оценённых релизов</div>`;
      return;
    }
    const latest = [...releases].sort((a, b) => {
      const da = a.date || "", db = b.date || "";
      if (da && db) return db.localeCompare(da);
      return 0;
    })[0] || releases[releases.length - 1];

    const score = Math.round(latest.avg1000);
    const pct   = Math.min(100, (latest.avg1000 / 1000) * 100);

    const trackLabel = latest.track_count ? ` · ${latest.track_count} ${plural(latest.track_count, "трек", "трека", "треков")}` : "";

    container.innerHTML = `
      <section class="release-card">
        <div class="release-top">
          ${coverHTML({
            artist: latest.artist,
            album:  latest.release,
            explicitUrl: latest.cover_url,
            sizeClass: "big"
          })}
          <div class="release-meta">
            <span class="pill">Последний релиз</span>
            <h1 class="release-title">${escapeHtml(latest.release)}</h1>
            <p class="release-artist">
              ${renderArtistLinks(latest.artist)}
              · ${escapeHtml(latest.type || "")}${trackLabel}
            </p>
            ${latest.system ? `<p class="release-system">Система: ${escapeHtml(latest.system)}</p>` : ""}
          </div>
        </div>
        <div class="rating-row">
          <div class="score">${score}</div>
          <div class="bar"><i data-width="${pct.toFixed(1)}%"></i></div>
        </div>
      </section>
    `;

    requestAnimationFrame(() => {
      const bar = $(".bar i", container);
      if (bar) setTimeout(() => { bar.style.width = bar.dataset.width; }, 200);
    });

    hydrateCovers(container);
  }

  function renderReleaseList(releases) {
    const list = $("#releaseList");
    $("#totalCount").textContent = releases.length;
    if (!releases.length) {
      list.innerHTML = `<li class="status">Нет данных</li>`;
      return;
    }
    const sorted = [...releases].sort((a, b) => {
      const da = a.date || "", db = b.date || "";
      if (da && db) return db.localeCompare(da);
      return 0;
    });
    list.innerHTML = sorted.map(r => {
      const trackLabel = r.track_count ? ` · ${r.track_count} ${plural(r.track_count, "трек", "трека", "треков")}` : "";
      return `
      <li class="release-item">
        ${coverHTML({
          artist: r.artist,
          album: r.release,
          explicitUrl: r.cover_url,
          sizeClass: "small"
        })}
        <div class="item-info">
          <div class="item-title">${escapeHtml(r.release)}</div>
          <div class="item-artist">
            ${renderArtistLinks(r.artist)}
            · ${escapeHtml(r.type || "")}${trackLabel}
          </div>
        </div>
        <div class="item-score">${Math.round(r.avg1000)}</div>
      </li>
    `}).join("");
    hydrateCovers(list);
  }

  function renderArtists() {
    const card = $("#artistsCard");
    if (!artistMap.size) {
      card.innerHTML = `<div class="status">Нет данных для топа</div>`;
      return;
    }
    const artists = [...artistMap.values()]
      .map(a => {
        const stats = calculateArtistStats(a);
        return {
          name: a.name,
          avg:  stats.avg,
          count: stats.count,
          totalTracks: stats.totalTracks,
          imageUrl: a.imageUrl
        };
      })
      .sort((a, b) => b.avg - a.avg)
      .slice(0, 10);

    card.innerHTML = artists.map((a, i) => {
      const bg   = artistGradient(a.name);
      const init = escapeHtml(initial(a.name));
      const imgHTML = a.imageUrl
        ? `<img src="${escapeHtml(a.imageUrl)}" alt="" onerror="this.remove()">`
        : "";
      return `
        <div class="artist-row ${i < 3 ? "top" : ""}" data-artist="${escapeHtml(a.name)}">
          <span class="rank">${i + 1}</span>
          <div class="avatar" style="background:${bg}">
            <span class="cover-initial">${init}</span>
            ${imgHTML}
          </div>
          <div class="artist-info">
            <div class="artist-name">${escapeHtml(a.name)}</div>
            <div class="artist-sub">${a.count} ${plural(a.count, "релиз", "релиза", "релизов")} · ${a.totalTracks} ${plural(a.totalTracks, "трек", "трека", "треков")}</div>
          </div>
          <div class="artist-score">${Math.round(a.avg)}</div>
        </div>
      `;
    }).join("");
  }

  /* ============================================================
     ЭКРАН АРТИСТА
     ============================================================ */
  function openArtist(name) {
    const entry = artistMap.get(name);
    if (!entry) return;
    currentArtist = name;
    haptic("light");

    const view    = $("#artistView");
    const content = $("#artistViewContent");
    const releases  = entry.releases;
    const stats     = calculateArtistStats(entry);

    view.style.setProperty("--artist-glow", artistGlow(name));

    const bg   = artistGradient(name);
    const init = escapeHtml(initial(name));

    const avatarImg = entry.imageUrl
      ? `<img src="${escapeHtml(entry.imageUrl)}" alt="" onerror="this.remove()">`
      : "";

    const internalTop = releases.map((r, i) => {
      const trackLabel = r.track_count ? ` · ${r.track_count} ${plural(r.track_count, "трек", "трека", "треков")}` : "";
      return `
      <div class="internal-top-item">
        <span class="rank">${i + 1}</span>
        ${coverHTML({
          artist: r.artist,
          album: r.release,
          explicitUrl: r.cover_url,
          sizeClass: "small"
        })}
        <div class="item-info">
          <div class="item-title">${escapeHtml(r.release)}</div>
          <div class="item-artist">${escapeHtml(r.type || "")}${trackLabel}${r.date ? " · " + escapeHtml(r.date) : ""}</div>
        </div>
        <div class="item-score">${Math.round(r.avg1000)}</div>
      </div>
    `}).join("");

    content.innerHTML = `
      <div class="artist-hero">
        <div class="avatar" style="background:${bg}">
          <span class="cover-initial">${init}</span>
          ${avatarImg}
        </div>
        <h1 class="artist-hero-name">${escapeHtml(name)}</h1>
        <div class="artist-hero-stats">
          <span class="stat-chip"><strong>${stats.count}</strong> ${plural(stats.count, "релиз", "релиза", "релизов")}</span>
          <span class="stat-chip"><strong>${stats.totalTracks}</strong> ${plural(stats.totalTracks, "трек", "трека", "треков")}</span>
          <span class="stat-chip">средний <strong>${Math.round(stats.avg)}</strong></span>
          <span class="stat-chip">лучший <strong>${Math.round(stats.bestScore)}</strong></span>
        </div>
      </div>
      <section class="block">
        <h2 class="block-title">Внутренний топ</h2>
        <div class="artists-card" style="padding:8px 4px">
          ${internalTop}
        </div>
      </section>
    `;

    view.classList.add("open");
    view.setAttribute("aria-hidden", "false");
    document.body.classList.add("locked");
    hydrateCovers(content);
  }

  function closeArtist() {
    if (!currentArtist) return;
    currentArtist = null;
    haptic("light");
    const view = $("#artistView");
    view.classList.remove("open");
    view.setAttribute("aria-hidden", "true");
    document.body.classList.remove("locked");
  }

  /* ============================================================
     СОБЫТИЯ
     ============================================================ */
  const accBtn   = $("#accBtn");
  const accPanel = $("#accPanel");
  accBtn.addEventListener("click", () => {
    const isOpen = accPanel.classList.toggle("open");
    accBtn.classList.toggle("open", isOpen);
    accBtn.setAttribute("aria-expanded", String(isOpen));
    haptic("light");
    if (isOpen) hydrateCovers(accPanel);

  document.addEventListener("click", (e) => {
    const link = e.target.closest(".artist-link, .artist-row");
    if (!link) return;

  /* ============================================================
     ЗАГРУЗКА ДАННЫХ
     ============================================================ */
  async function loadData() {
    try {
      const res = await fetch(API_URL, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (!Array.isArray(data)) throw new Error("Ожидался массив");

      allReleases = data.map(row => {
        const avg     = Number(row.avg) || 0;
        const scale   = Number(row.scale) || 1000;
        const avg1000 = Number(row.avg1000) ||
          (avg && scale ? (avg / scale) * 1000 : 0);
        
        const rawTracks = Number(row.track_count ?? row["треки"] ?? row["треков"] ?? 0);
        const typeStr   = String(row.type || "").trim();
        let track_count = 1;
        if (isFinite(rawTracks) && rawTracks > 0) {
          track_count = Math.round(rawTracks);
        } else {
          if (/альбом|album|lp/i.test(typeStr)) track_count = 10;
          else if (/ep|мини/i.test(typeStr)) track_count = 4;
          else track_count = 1;
        }

        return {
          artist:           row.artist || "",
          release:          row.release || "",
          type:             typeStr,
          track_count,
          system:           row.system || "",
          cover_url:        row.cover_url || "",
          artist_image_url: row.artist_image_url || "",
          avg, avg1000,
          date: row.date || ""
        };
      }).filter(r => r.release && r.artist);

      buildArtistMap(allReleases);
      renderLatest(allReleases);
      renderReleaseList(allReleases);
      renderArtists();

      dbg(`Загружено релизов: ${allReleases.length}`, true);

    } catch (err) {
      dbg(`Ошибка загрузки данных: ${err.message}`, false);
      $("#latestContainer").innerHTML = `<div class="status error">Не удалось загрузить данные.</div>`;
      $("#releaseList").innerHTML = `<li class="status error">Ошибка загрузки</li>`;
      $("#artistsCard").innerHTML = `<div class="status error">Ошибка загрузки</div>`;
    }
  }

  loadData();
</script>
</body>
</html>
